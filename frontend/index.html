<!DOCTYPE html>
<!-- Le dice al navegador: esto es una página web moderna. -->
<html lang="es">
  <head>
    <!-- Cabecera: no se ve, pero prepara letras, colores y el título de la pestaña. -->
    <meta charset="UTF-8" />
    <!-- Acepta tildes y eñes sin romper caracteres. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- En el celular, la página usa el ancho real de la pantalla y no se ve en miniatura. -->
    <meta name="theme-color" content="#1a100b" />
    <!-- Colorea la barra del celular de marrón oscuro, a tono con el reino. -->
    <title>Narnia — Entrar al Reino</title>
    <!-- Texto de la pestaña del navegador. -->

    <!-- Pedimos las tipografías medievales a Google antes de pintar la página. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Hojas de estilo, cada una se ocupa de una parte: escena, panel, form, botón, redes. -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="stylesheet" href="css/form.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/icons.css" />
  </head>
  <body>
    <!-- Escena completa: bosque de fondo + panel de madera al centro. -->
    <section class="realm" aria-label="Acceso al reino">
      <!-- Capa 1: foto del bosque. aria-hidden: es decoración, no hay que “leerla”. -->
      <div class="realm__backdrop" aria-hidden="true"></div>
      <!-- Capa 2: velo oscuro para que el texto del panel se lea bien. -->
      <div class="realm__overlay" aria-hidden="true"></div>
      <!-- Capa 3: bruma dorada suave abajo, solo atmósfera. -->
      <div class="realm__mist" aria-hidden="true"></div>

      <!-- Caja central: marco de raíces + tabla de madera. -->
      <div class="login-panel">
        <div class="login-panel__frame" aria-hidden="true"></div>
        <div class="login-panel__wood">
          <!-- Marca: yelmo, nombre del reino y una frase de bienvenida. -->
          <header class="login-brand">
            <div class="login-brand__crest-wrap">
              <!-- alt vacío: el yelmo es adorno; el título “Narnia” ya nombra la página. -->
              <img
                class="login-brand__crest"
                src="assets/crest-helmet.png"
                alt=""
                width="88"
                height="88"
              />
            </div>
            <p class="login-brand__kicker">Crónicas del reino</p>
            <h1 class="login-brand__title">Narnia</h1>
            <p class="login-brand__subtitle">Las puertas aguardan tu nombre</p>
            <!-- Línea de oro con una gema: separa el logo del formulario. -->
            <div class="login-brand__divider" aria-hidden="true">
              <span class="login-brand__jewel"></span>
            </div>
          </header>

          <!--
            Formulario de ingreso.
            action="/login": si no hubiera JavaScript, iría a esa dirección del servidor.
            novalidate: el chequeo de campos vacíos lo hacemos nosotros, con el mensaje del reino.
          -->
          <form class="login-form" id="login-form" action="/login" method="post" novalidate>
            <!-- Recado que aparece si algo falla o si un camino todavía no existe. -->
            <p class="login-alert" id="login-alert" role="alert" hidden></p>

            <!-- Campo usuario: el label “Usuario” queda visible aunque escribas. -->
            <div class="login-field">
              <label class="login-field__label" for="username">Usuario</label>
              <div class="login-field__control">
                <!-- Sobre: dibujo simple, no un emoji, para que se vea igual en todos los celulares. -->
                <span class="login-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <rect x="3.5" y="5.5" width="17" height="13" rx="1.8" stroke="currentColor" stroke-width="1.6" />
                    <path d="M4 7.5 12 13l8-5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>
                <!--
                  name="username": así viaja al servidor, que busca exactamente esa palabra.
                  required: no se puede enviar vacío.
                -->
                <input
                  class="login-field__input"
                  id="username"
                  type="text"
                  name="username"
                  autocomplete="username"
                  autocapitalize="off"
                  spellcheck="false"
                  placeholder="Escribí tu usuario"
                  required
                />
              </div>
            </div>

            <!-- Campo clave: type="password" tapa las letras con puntos. -->
            <div class="login-field">
              <label class="login-field__label" for="pass">Contraseña</label>
              <div class="login-field__control">
                <span class="login-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="8" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6" />
                    <path d="M11.2 12H20v2.1h-2.2V16H15.6v-1.9h-4.4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                  </svg>
                </span>
                <!-- name="pass": el servidor espera “pass”, no “password”. -->
                <input
                  class="login-field__input"
                  id="pass"
                  type="password"
                  name="pass"
                  autocomplete="current-password"
                  placeholder="••••••••"
                  required
                />
                <!-- type="button": muestra u oculta la clave; no envía el formulario. -->
                <button
                  class="login-field__reveal"
                  type="button"
                  id="toggle-pass"
                  aria-controls="pass"
                  aria-pressed="false"
                  aria-label="Mostrar contraseña"
                >
                  <svg class="icon-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2.8 12S6.2 6.8 12 6.8 21.2 12 21.2 12 17.8 17.2 12 17.2 2.8 12 2.8 12Z" stroke="currentColor" stroke-width="1.6" />
                    <circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.6" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- type="submit": al tocarlo, JavaScript habla con el servidor. -->
            <button class="login-button" type="submit" id="login-submit">
              <span class="login-button__glow" aria-hidden="true"></span>
              <span class="login-button__spinner" aria-hidden="true"></span>
              <span class="login-button__label">Entrar al Reino</span>
            </button>

            <!-- Estos enlaces todavía no tienen servidor detrás: JS avisa con un recado. -->
            <nav class="login-links" aria-label="Opciones de cuenta">
              <a class="login-links__item" href="#registrar" data-unavailable="registrar">Crear cuenta</a>
              <span class="login-links__sep" aria-hidden="true"></span>
              <a class="login-links__item" href="#recuperar" data-unavailable="recuperar">Recuperar acceso</a>
            </nav>

            <div class="login-split" aria-hidden="true"><span>o continuar</span></div>

            <!-- Círculos de redes: mismos avisos “todavía no está conectado”. -->
            <ul class="social-icons">
              <li>
                <a class="social-icon social-icon--facebook" href="#facebook" data-unavailable="facebook" aria-label="Continuar con Facebook">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14.2 8.4H16V6.1h-1.8c-2.1 0-3.6 1.5-3.6 3.5V11H8.8v2.4h1.8V20h2.5v-6.6h2.3l.5-2.4h-2.8V9.6c0-.7.4-1.2 1.1-1.2Z" />
                  </svg>
                </a>
              </li>
              <li>
                <a class="social-icon social-icon--ok" href="#ok" data-unavailable="ok" aria-label="Continuar con Odnoklassniki">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 11.2a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Zm0-5.1a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4Zm4.1 7.4a7.4 7.4 0 0 1-8.2 0l-1 1.5a8.8 8.8 0 0 0 3.6 1.6l-3.5 3.5 1.2 1.2L12 17.6l3.8 3.7 1.2-1.2-3.5-3.5a8.8 8.8 0 0 0 3.6-1.6l-1-1.5Z" />
                  </svg>
                </a>
              </li>
              <li>
                <a class="social-icon social-icon--vk" href="#vk" data-unavailable="vk" aria-label="Continuar con VK">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M13.2 16.6c-4.3 0-6.8-3-6.9-8h2.2c.1 3.6 1.7 5.1 3 5.3V8.6h2.1v3c1.2-.1 2.5-1.5 3-3h2.1c-.4 2.3-1.8 3.6-2.8 4.1 1 .4 2.6 1.5 3.2 3.9h-2.3c-.5-1.6-1.8-2.8-3.2-3v3Z" />
                  </svg>
                </a>
              </li>
              <li>
                <a class="social-icon social-icon--guest" href="#invitado" data-unavailable="invitado" aria-label="Entrar como invitado">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 12.4a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Zm0 1.5c3.4 0 6.2 1.8 6.2 4v.7H5.8V17.9c0-2.2 2.8-4 6.2-4Z" />
                  </svg>
                </a>
              </li>
            </ul>
          </form>
        </div>
      </div>
    </section>
    <!-- Cerebro del login: envía usuario y clave, muestra errores, abre el reino. -->
    <script src="js/login.js"></script>
  </body>
</html>
